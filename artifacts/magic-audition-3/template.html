<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOB STORY 魔法3種の音比較</title><style>
*{box-sizing:border-box}body{margin:0;background:#101925;color:#eef6ff;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto;padding:20px}h1{font-size:24px;margin-bottom:8px}p{line-height:1.7;color:#b9c9d8}button,select{font:inherit;color:inherit;background:#26394b;border:1px solid #628199;border-radius:12px;padding:12px;touch-action:manipulation}button[aria-pressed=true]{background:#165563;border-color:#6ce8dc}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}nav button{flex:1}.stage{height:290px;background:radial-gradient(ellipse at 50% 62%,#354e63,#192533 65%);position:relative;border:1px solid #456078;border-radius:18px;overflow:hidden}.target{position:absolute;left:50%;top:54%;width:110px;height:30px;border:1px dashed #7d97ad;border-radius:50%;transform:translate(-50%,80px)}small{display:block;color:#a9becf;line-height:1.7}output{display:block;min-height:50px;font-size:14px;line-height:1.6;margin-top:12px}progress{width:100%;height:6px;accent-color:#64d8cb}label{display:flex;gap:8px;align-items:center}/*FRAME_CSS*/
</style><main><small>MOB STORY / 本体変更なし・比較試作</small><h1>魔法と音を合わせて比較</h1><p>実際の画像・フレーム順・表示時間を使用。<br>炎・水・雷の3種だけを確認できます。</p><nav><button data-spell="0" aria-pressed="true">炎 ホノ</button><button data-spell="1" aria-pressed="false">水 ネプ</button><button data-spell="2" aria-pressed="false">雷 トル</button></nav><div class="controls"><label>音<select id="mode"><option value="improved">改善案：質感中心</option><option value="old">旧音：現行v257</option></select></label><button id="play">▶ 再生</button><button id="stop">■ 停止</button></div><div class="stage"><div class="target"></div><div id="skillSpriteFx" class="skill-sprite-fx" hidden></div></div><output id="status">同じ音量基準で比較します。再生を押してください。</output><progress max="800" value="0"></progress><small>氷属性魔法がないため水を採用。元演出に独立した飛翔移動はありません。実聴・Safari実機は未確認です。</small></main><script>
/*DATA*/
const $=s=>document.querySelector(s);let ac,voice,pending,selected=0,serial=0,run=null,waiters=[],raf=0;const buffers=new Map();window.audit=[];
function stop(){serial++;cancelAnimationFrame(raf);for(const w of waiters){clearTimeout(w.id);w.reject(new Error('cancelled'));}waiters=[];try{voice?.stop();voice?.disconnect();}catch{}voice=null;$('#skillSpriteFx').hidden=true;$('#skillSpriteFx').replaceChildren();run=null;$('progress').value=0;$('#status').textContent='停止しました';}
function fixedDelay(ms){return new Promise((resolve,reject)=>{const w={reject,id:setTimeout(()=>{waiters=waiters.filter(x=>x!==w);resolve();},ms)};waiters.push(w);});}
async function nextPaint(n=1){while(n--)await new Promise(requestAnimationFrame);}const positionEffect=()=>{},bindImage=()=>{};async function ensureDomImageReady(img){await img.decode();}
/*ACTUAL_ANIMATION*/
const observer=new MutationObserver(()=>{const img=$('#skillSpriteFx .active');if(!run||!img||run.last===img.src)return;run.last=img.src;const time=performance.now();if(!run.start){run.start=time;voice=ac.createBufferSource();voice.buffer=buffers.get(selected+$('#mode').value);voice.connect(ac.destination);voice.start(ac.currentTime+.003);const current=voice;voice.onended=()=>{current.disconnect();if(voice===current)voice=null;};window.audit.push({type:'audio',mode:$('#mode').value,spell:spells[selected].id,at:time});}window.audit.push({type:'frame',src:img.getAttribute('src'),ms:time-run.start});$('#status').textContent=spells[selected].name+' / '+($('#mode').value==='old'?'旧音':'改善案')+' / '+Math.round(time-run.start)+'ms';});observer.observe($('#skillSpriteFx'),{subtree:true,attributes:true,attributeFilter:['class']});
async function play(){stop();const token=serial;try{await pending?.catch(()=>{});if(token!==serial)return;ac??=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();const s=spells[selected],key=selected+$('#mode').value;if(!buffers.has(key)){const bytes=Uint8Array.from(atob(s[$('#mode').value]),c=>c.charCodeAt(0));buffers.set(key,await ac.decodeAudioData(bytes.buffer));}await Promise.all(s.frames.map(src=>{const im=new Image();im.src=src;return im.decode();}));if(token!==serial)return;run={start:0,last:''};window.audit=[];const tick=()=>{if(token!==serial)return;if(run?.start)$('progress').value=Math.min(800,performance.now()-run.start);raf=requestAnimationFrame(tick);};tick();pending=skillSprite(s.frames,'enemy','default');await pending;if(token!==serial)return;window.audit.push({type:'impact/end',ms:performance.now()-run.start});$('#status').textContent=s.name+' / 消失・ダメージ判定 '+Math.round(performance.now()-run.start)+'ms';await fixedDelay(Math.max(0,800-(performance.now()-run.start)));if(token===serial){cancelAnimationFrame(raf);run=null;$('progress').value=800;}}catch(e){if(token===serial)$('#status').textContent='再生できませんでした：'+e.message;}}
window.previewState=()=>({audio:ac?.state,playing:!!voice,run:!!run});$('#play').onclick=play;$('#stop').onclick=stop;$('#mode').onchange=stop;document.querySelectorAll('[data-spell]').forEach(b=>b.onclick=()=>{stop();selected=Number(b.dataset.spell);document.querySelectorAll('[data-spell]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',stop);
</script></html>
