<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MOB QUEST - Test Battle</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <!-- HOME -->
    <section id="homeScreen" class="screen active">
      <header class="topbar">
        <div class="brand">
          <img src="icon/01.png" alt="MOB QUEST" class="brand-logo" data-fallback="MOB QUEST">
          <span class="brand-fallback">MOB QUEST</span>
        </div>
        <div class="currency">
          <span class="currency-chip">🪙 <b id="coinValue">12,500</b></span>
          <span class="currency-chip">◆ <b id="diamondValue">320</b></span>
        </div>
      </header>

      <section class="home-stage">
        <img src="back/01.png" alt="" class="home-bg" aria-hidden="true">
        <div class="home-overlay"></div>
        <div class="rotating-ring" aria-hidden="true"></div>
        <div id="homeParty" class="home-party"></div>
      </section>

      <nav class="home-menu" aria-label="メインメニュー">
        <button type="button" class="menu-btn" data-home-action="adventure">
          <span class="menu-icon">⚔</span>
          <span>冒険</span>
        </button>
        <button type="button" class="menu-btn" data-home-action="party">
          <span class="menu-icon">👥</span>
          <span>パーティー</span>
        </button>
        <button type="button" class="menu-btn" data-home-action="castle">
          <span class="menu-icon">🏰</span>
          <span>お城</span>
        </button>
        <button type="button" class="menu-btn primary" data-home-action="test">
          <span class="menu-icon">🧪</span>
          <span>テストバトル</span>
        </button>
      </nav>
    </section>

    <!-- SETUP -->
    <section id="setupScreen" class="screen">
      <header class="sub-header">
        <button type="button" id="setupBackBtn" class="ghost-btn">← HOME</button>
        <div class="header-title">TEST BATTLE SETUP</div>
        <button type="button" id="randomBtn" class="ghost-btn">ランダム</button>
      </header>

      <div class="setup-layout">
        <section class="panel">
          <div class="panel-title">PLAYER PARTY</div>
          <div id="playerSetup"></div>
        </section>

        <section class="panel">
          <div class="panel-title">ENEMY PARTY</div>
          <div id="enemySetup"></div>
        </section>
      </div>

      <div class="setup-actions">
        <button type="button" id="startBattleBtn" class="big-btn primary">戦闘開始</button>
      </div>

      <p class="helper">
        画像未配置でも仮表示で動作します。後から <code>play/01.png</code> などを追加してください。
      </p>
    </section>

    <!-- BATTLE -->
    <section id="battleScreen" class="screen">
      <header class="sub-header battle-header">
        <button type="button" id="battleBackBtn" class="ghost-btn">← 編成</button>
        <div id="turnLabel" class="turn-label">TURN 1</div>
        <button type="button" id="restartBtn" class="ghost-btn">再戦</button>
      </header>

      <section id="battleField" class="battle-field" aria-label="戦闘画面">
        <div id="enemyUnits" class="unit-row enemy-row"></div>
        <div id="allyUnits" class="unit-row ally-row"></div>

        <div id="skillBanner" class="skill-banner" aria-live="polite"></div>
        <div id="centerMessage" class="center-message" aria-live="polite"></div>

        <div id="slashFx" class="slash-fx" aria-hidden="true"></div>
        <div id="magicFx" class="magic-fx" aria-hidden="true"></div>

        <div class="battle-command">
          <button type="button" id="attackBtn" class="command-btn primary">通常攻撃</button>
          <button type="button" id="skillBtn" class="command-btn">必殺技</button>
          <button type="button" id="autoBtn" class="command-btn">AUTO</button>
          <button type="button" id="nextTurnBtn" class="command-btn">1ターン</button>
        </div>
      </section>

      <section class="battle-log-panel">
        <div class="panel-title">BATTLE LOG</div>
        <div id="battleLog" class="battle-log" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
